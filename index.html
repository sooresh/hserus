<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binance Futures Scanner</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #12161c;
            color: #eaecef;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background-color: #1e2329;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 1.3rem;
            color: #f0b90b;
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        label {
            font-size: 0.9rem;
            color: #848e9c;
        }

        select, button {
            background-color: #2b313a;
            color: #eaecef;
            border: 1px solid #474d57;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            outline: none;
            font-size: 0.9rem;
        }

        select:focus, button:hover {
            border-color: #f0b90b;
        }

        button {
            background-color: #f0b90b;
            color: #000;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #d8a407;
        }

        button:disabled {
            background-color: #474d57;
            color: #848e9c;
            cursor: not-allowed;
        }

        /* Progress Bar */
        .progress-container {
            margin-bottom: 20px;
            background-color: #1e2329;
            padding: 15px;
            border-radius: 8px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: #848e9c;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background-color: #2b313a;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: #f0b90b;
            transition: width 0.15s ease;
        }

        /* Table Styles */
        .table-container {
            background-color: #1e2329;
            border-radius: 8px;
            overflow-x: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid #2b313a;
            font-size: 0.9rem;
        }

        th {
            background-color: #181a20;
            color: #848e9c;
            font-weight: 600;
            user-select: none;
        }

        th.sortable {
            cursor: pointer;
        }

        th.sortable:hover {
            color: #f0b90b;
        }

        tr:hover {
            background-color: #2b313a;
        }

        .text-green { color: #0ecb81; }
        .text-red { color: #f6465d; }
        
        .badge-true {
            background-color: rgba(14, 203, 129, 0.15);
            color: #0ecb81;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8rem;
        }
        .badge-false {
            background-color: rgba(246, 70, 93, 0.15);
            color: #f6465d;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8rem;
        }
        .badge-type {
            background-color: rgba(240, 185, 11, 0.15);
            color: #f0b90b;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #848e9c;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Binance Futures Scanner</h1>
        <div class="controls">
            <label for="timeframe">TF:</label>
            <select id="timeframe">
                <option value="1h" selected>1h</option>
                <option value="4h">4h</option>
            </select>
            <button id="scanBtn" onclick="startScan()">Scan Now</button>
        </div>
    </header>

    <div class="progress-container">
        <div class="progress-info">
            <span id="progressText">Status: Ready</span>
            <span id="progressCount">0 / 250</span>
        </div>
        <div class="progress-bar-bg">
            <div id="progressBar" class="progress-bar-fill"></div>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Symbol</th>
                    <th class="sortable" onclick="sortTable('priceChg')">Price Chg % ⇕</th>
                    <th class="sortable" onclick="sortTable('volChg')">Vol Chg % ⇕</th>
                    <th class="sortable" onclick="sortTable('wickDom')">Wick Dom ⇕</th>
                    <th class="sortable" onclick="sortTable('triggerType')">Trigger ⇕</th>
                </tr>
            </thead>
            <tbody id="resultsTable">
                <tr>
                    <td colspan="5" class="empty-state">Click "Scan Now" to search top 250 USDT perpetual pairs.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    let matchedResults = [];
    let currentSortColumn = '';
    let currentSortAsc = false;

    // Technical Analysis Calculation Helpers
    function calculateSMA(closes, period) {
        let sma = [];
        for (let i = 0; i < closes.length; i++) {
            if (i < period - 1) {
                sma.push(null);
                continue;
            }
            let sum = 0;
            for (let j = 0; j < period; j++) {
                sum += closes[i - j];
            }
            sma.push(sum / period);
        }
        return sma;
    }

    function calculateBollingerBands(closes, period = 20, stdDevMult = 2) {
        const sma = calculateSMA(closes, period);
        let upper = [];
        let lower = [];

        for (let i = 0; i < closes.length; i++) {
            if (i < period - 1) {
                upper.push(null);
                lower.push(null);
                continue;
            }
            let sumSquareDiffs = 0;
            for (let j = 0; j < period; j++) {
                sumSquareDiffs += Math.pow(closes[i - j] - sma[i], 2);
            }
            const stdDev = Math.sqrt(sumSquareDiffs / period);
            upper.push(sma[i] + (stdDev * stdDevMult));
            lower.push(sma[i] - (stdDev * stdDevMult));
        }

        return { sma, upper, lower };
    }

    // Main Scanning Logic
    async function startScan() {
        const scanBtn = document.getElementById('scanBtn');
        const timeframeSelect = document.getElementById('timeframe');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const progressCount = document.getElementById('progressCount');
        const resultsTable = document.getElementById('resultsTable');

        const interval = timeframeSelect.value;

        // UI Reset
        scanBtn.disabled = true;
        matchedResults = [];
        resultsTable.innerHTML = '';
        progressBar.style.width = '0%';
        progressText.innerText = 'Fetching top 250 USDT perpetual pairs by volume...';
        progressCount.innerText = '0 / 250';

        try {
            // Fetch top 250 USDT Perpetual Futures by 24h Volume
            const tickerResponse = await fetch('https://fapi.binance.com/fapi/v1/ticker/24hr');
            const tickers = await tickerResponse.json();

            const top250Symbols = tickers
                .filter(t => t.symbol.endsWith('USDT'))
                .sort((a, b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume))
                .slice(0, 250)
                .map(t => t.symbol);

            const batchSize = 10;
            const totalSymbols = top250Symbols.length;

            progressText.innerText = 'Scanning symbols...';

            // Process symbols in batches of 10
            for (let i = 0; i < totalSymbols; i += batchSize) {
                const batch = top250Symbols.slice(i, i + batchSize);

                const batchPromises = batch.map(async (symbol) => {
                    try {
                        // Request klines (limit 25 is enough for SMA 20 calculation)
                        const klineRes = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=${interval}&limit=25`);
                        const klines = await klineRes.json();

                        if (!klines || klines.length < 25) return null;

                        // Parse candle values
                        const opens = klines.map(k => parseFloat(k[1]));
                        const highs = klines.map(k => parseFloat(k[2]));
                        const lows = klines.map(k => parseFloat(k[3]));
                        const closes = klines.map(k => parseFloat(k[4]));
                        const volumes = klines.map(k => parseFloat(k[5]));

                        const currIdx = klines.length - 1;
                        const prevIdx = currIdx - 1;

                        const currVol = volumes[currIdx];
                        const prevVol = volumes[prevIdx];
                        const currOpen = opens[currIdx];
                        const currHigh = highs[currIdx];
                        const currLow = lows[currIdx];
                        const currClose = closes[currIdx];
                        const prevClose = closes[prevIdx];

                        // --- Condition (1): Current vol > Prev vol * 1.5 ---
                        if (!(currVol > prevVol * 1.5)) return null;

                        // --- Condition (2): Abs(Current close chg) > 1% ---
                        const closeChgPct = ((currClose - prevClose) / prevClose) * 100;
                        if (Math.abs(closeChgPct) <= 1.0) return null;

                        // Technical indicators calculation
                        const { sma, upper, lower } = calculateBollingerBands(closes, 20, 2);

                        const currUpper = upper[currIdx];
                        const prevUpper = upper[prevIdx];
                        const currLower = lower[currIdx];
                        const prevLower = lower[prevIdx];
                        const currSMA = sma[currIdx];

                        const isGreen = currClose >= currOpen;
                        const isRed = !isGreen;

                        // --- Condition (3): ---
                        // Green candle -> Upper BB should NOT be increasing (currUpper <= prevUpper)
                        // Red candle   -> Lower BB should NOT be decreasing (currLower >= prevLower)
                        if (isGreen && (currUpper > prevUpper)) return null;
                        if (isRed && (currLower < prevLower)) return null;

                        // --- Condition (4): Sequential sub-condition evaluation ---
                        let triggerType = null;
                        const maxAllowedDist = 0.15 * Math.abs(closeChgPct);

                        if (isGreen) {
                            // (4a) Open & Close below SMA 20, High > SMA 20, Dist <= 15% of Close Change %
                            const distFromSMA = (Math.abs(currClose - currSMA) / currClose) * 100;
                            if (currOpen < currSMA && currClose < currSMA && currHigh > currSMA && distFromSMA <= maxAllowedDist) {
                                triggerType = 'SMA 20';
                            } 
                            // (4b) Open & Close below Upper BB, High > Upper BB, Dist <= 15% of Close Change %
                            else {
                                const distFromUpper = (Math.abs(currClose - currUpper) / currClose) * 100;
                                if (currOpen < currUpper && currClose < currUpper && currHigh > currUpper && distFromUpper <= maxAllowedDist) {
                                    triggerType = 'BB';
                                }
                            }
                        } else {
                            // (4c) Open & Close above SMA 20, Low < SMA 20, Dist <= 15% of Close Change %
                            const distFromSMA = (Math.abs(currClose - currSMA) / currClose) * 100;
                            if (currOpen > currSMA && currClose > currSMA && currLow < currSMA && distFromSMA <= maxAllowedDist) {
                                triggerType = 'SMA 20';
                            } 
                            // (4d) Open & Close above Lower BB, Low < Lower BB, Dist <= 15% of Close Change %
                            else {
                                const distFromLower = (Math.abs(currClose - currLower) / currClose) * 100;
                                if (currOpen > currLower && currClose > currLower && currLow < currLower && distFromLower <= maxAllowedDist) {
                                    triggerType = 'BB';
                                }
                            }
                        }

                        // Exit if none of the 4a/4b/4c/4d conditions matched
                        if (!triggerType) return null;

                        // --- Dashboard Metrics Calculation ---
                        // Wick Dominance Logic:
                        // Green candle: Lower Wick > Upper Wick
                        // Red candle: Upper Wick > Lower Wick
                        let upperWick = currHigh - Math.max(currOpen, currClose);
                        let lowerWick = Math.min(currOpen, currClose) - currLow;

                        let wickDom = false;
                        if (isGreen && lowerWick > upperWick) {
                            wickDom = true;
                        } else if (isRed && upperWick > lowerWick) {
                            wickDom = true;
                        }

                        const volChgPct = ((currVol - prevVol) / prevVol) * 100;

                        return {
                            symbol: symbol,
                            priceChg: closeChgPct,
                            volChg: volChgPct,
                            wickDom: wickDom,
                            triggerType: triggerType
                        };

                    } catch (err) {
                        console.error(`Error scanning ${symbol}:`, err);
                        return null;
                    }
                });

                const batchResults = await Promise.all(batchPromises);

                batchResults.forEach(res => {
                    if (res !== null) matchedResults.push(res);
                });

                // Update Progress Controls
                const scannedCount = Math.min(i + batchSize, totalSymbols);
                const percent = (scannedCount / totalSymbols) * 100;
                progressBar.style.width = `${percent}%`;
                progressCount.innerText = `${scannedCount} / ${totalSymbols}`;

                renderTable();
            }

            progressText.innerText = 'Scan Complete!';

        } catch (error) {
            console.error('Scan Error:', error);
            progressText.innerText = 'Scan interrupted. See console for details.';
        } finally {
            scanBtn.disabled = false;
        }
    }

    // Dashboard Table Logic & Sorting
    function renderTable() {
        const resultsTable = document.getElementById('resultsTable');

        if (matchedResults.length === 0) {
            resultsTable.innerHTML = `<tr><td colspan="5" class="empty-state">No matching setups found.</td></tr>`;
            return;
        }

        let html = '';
        matchedResults.forEach(item => {
            const priceClass = item.priceChg >= 0 ? 'text-green' : 'text-red';
            const priceSign = item.priceChg >= 0 ? '+' : '';
            const wickBadge = item.wickDom 
                ? '<span class="badge-true">TRUE</span>' 
                : '<span class="badge-false">FALSE</span>';

            html += `
                <tr>
                    <td><strong>${item.symbol}</strong></td>
                    <td class="${priceClass}">${priceSign}${item.priceChg.toFixed(2)}%</td>
                    <td class="text-green">+${item.volChg.toFixed(1)}%</td>
                    <td>${wickBadge}</td>
                    <td><span class="badge-type">${item.triggerType}</span></td>
                </tr>
            `;
        });

        resultsTable.innerHTML = html;
    }

    function sortTable(column) {
        if (matchedResults.length === 0) return;

        if (currentSortColumn === column) {
            currentSortAsc = !currentSortAsc;
        } else {
            currentSortColumn = column;
            currentSortAsc = false; // Default descending sort
        }

        matchedResults.sort((a, b) => {
            let valA = a[column];
            let valB = b[column];

            if (typeof valA === 'boolean') {
                valA = valA ? 1 : 0;
                valB = valB ? 1 : 0;
            }

            if (typeof valA === 'string') {
                return currentSortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
            }

            return currentSortAsc ? valA - valB : valB - valA;
        });

        renderTable();
    }
</script>

</body>
</html>
