<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hserus</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #12161c;
            color: #eaecef;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background-color: #1e2329;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 1.3rem;
            color: #f0b90b;
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        label {
            font-size: 0.9rem;
            color: #848e9c;
        }

        select, button {
            background-color: #2b313a;
            color: #eaecef;
            border: 1px solid #474d57;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            outline: none;
            font-size: 0.9rem;
        }

        select:focus, button:hover {
            border-color: #f0b90b;
        }

        button {
            background-color: #f0b90b;
            color: #000;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #d8a407;
        }

        button:disabled {
            background-color: #474d57;
            color: #848e9c;
            cursor: not-allowed;
        }

        /* Progress Bar */
        .progress-container {
            margin-bottom: 20px;
            background-color: #1e2329;
            padding: 15px;
            border-radius: 8px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: #848e9c;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background-color: #2b313a;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: #f0b90b;
            transition: width 0.15s ease;
        }

        /* Table Styles */
        .table-container {
            background-color: #1e2329;
            border-radius: 8px;
            overflow-x: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid #2b313a;
            font-size: 0.9rem;
        }

        th {
            background-color: #181a20;
            color: #848e9c;
            font-weight: 600;
            user-select: none;
        }

        th.sortable {
            cursor: pointer;
        }

        th.sortable:hover {
            color: #f0b90b;
        }

        tr:hover {
            background-color: #2b313a;
        }

        .text-green { color: #0ecb81; }
        .text-red { color: #f6465d; }
        
        .badge-true {
            background-color: rgba(14, 203, 129, 0.15);
            color: #0ecb81;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8rem;
        }
        .badge-false {
            color: #848e9c;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #848e9c;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>hserus</h1>
        <div class="controls">
            <label for="timeframe">TF:</label>
            <select id="timeframe">
                <option value="1h" selected>1h</option>
                <option value="4h">4h</option>
            </select>
            <button id="scanBtn" onclick="startScan()">Scan Now</button>
        </div>
    </header>

    <div class="progress-container">
        <div class="progress-info">
            <span id="progressText">Status: Ready</span>
            <span id="progressCount">0 / 250</span>
        </div>
        <div class="progress-bar-bg">
            <div id="progressBar" class="progress-bar-fill"></div>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Symbol</th>
                    <th class="sortable" onclick="sortTable('currPriceChg')">Curr Prc Chg % ⇕</th>
                    <th class="sortable" onclick="sortTable('currVolChg')">Curr Vol Chg % ⇕</th>
                    <th class="sortable" onclick="sortTable('prevVolChg')">Prev Vol Chg % ⇕</th>
                    <th class="sortable" onclick="sortTable('smaCheck')">SMA 20 Chk ⇕</th>
                </tr>
            </thead>
            <tbody id="resultsTable">
                <tr>
                    <td colspan="5" class="empty-state">Click "Scan Now".</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    let matchedResults = [];
    let currentSortColumn = '';
    let currentSortAsc = false;

    // Technical Analysis Helpers
    function calculateSMA(closes, period) {
        let sma = [];
        for (let i = 0; i < closes.length; i++) {
            if (i < period - 1) {
                sma.push(null);
                continue;
            }
            let sum = 0;
            for (let j = 0; j < period; j++) {
                sum += closes[i - j];
            }
            sma.push(sum / period);
        }
        return sma;
    }

    function calculateATR(highs, lows, closes, period = 14) {
        let trs = [];
        for (let i = 0; i < highs.length; i++) {
            if (i === 0) {
                trs.push(highs[i] - lows[i]);
            } else {
                let tr = Math.max(
                    highs[i] - lows[i],
                    Math.abs(highs[i] - closes[i - 1]),
                    Math.abs(lows[i] - closes[i - 1])
                );
                trs.push(tr);
            }
        }

        let atr = [];
        for (let i = 0; i < trs.length; i++) {
            if (i < period - 1) {
                atr.push(null);
                continue;
            }
            let sum = 0;
            for (let j = 0; j < period; j++) {
                sum += trs[i - j];
            }
            atr.push(sum / period);
        }
        return atr;
    }

    // Main Scanning Process
    async function startScan() {
        const scanBtn = document.getElementById('scanBtn');
        const timeframeSelect = document.getElementById('timeframe');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const progressCount = document.getElementById('progressCount');
        const resultsTable = document.getElementById('resultsTable');

        const interval = timeframeSelect.value;

        // UI Reset
        scanBtn.disabled = true;
        matchedResults = [];
        resultsTable.innerHTML = '';
        progressBar.style.width = '0%';
        progressText.innerText = 'Fetching top 250 USDT perpetual futures by volume...';
        progressCount.innerText = '0 / 250';

        try {
            const tickerResponse = await fetch('https://fapi.binance.com/fapi/v1/ticker/24hr');
            const tickers = await tickerResponse.json();

            const top250Symbols = tickers
                .filter(t => t.symbol.endsWith('USDT'))
                .sort((a, b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume))
                .slice(0, 250)
                .map(t => t.symbol);

            const batchSize = 10;
            const totalSymbols = top250Symbols.length;

            progressText.innerText = 'Scanning symbols...';

            for (let i = 0; i < totalSymbols; i += batchSize) {
                const batch = top250Symbols.slice(i, i + batchSize);

                const batchPromises = batch.map(async (symbol) => {
                    try {
                        // Request 40 candles to safely compute ATR 14 and SMA 20
                        const klineRes = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=${interval}&limit=40`);
                        const klines = await klineRes.json();

                        if (!klines || klines.length < 30) return null;

                        const opens = klines.map(k => parseFloat(k[1]));
                        const highs = klines.map(k => parseFloat(k[2]));
                        const lows = klines.map(k => parseFloat(k[3]));
                        const closes = klines.map(k => parseFloat(k[4]));
                        const volumes = klines.map(k => parseFloat(k[5]));

                        const currIdx = klines.length - 1;
                        const prevIdx = currIdx - 1;
                        const prevPrevIdx = currIdx - 2;

                        const currOpen = opens[currIdx];
                        const currClose = closes[currIdx];
                        const currHigh = highs[currIdx];
                        const currLow = lows[currIdx];
                        const currVol = volumes[currIdx];

                        const prevOpen = opens[prevIdx];
                        const prevClose = closes[prevIdx];
                        const prevHigh = highs[prevIdx];
                        const prevLow = lows[prevIdx];
                        const prevVol = volumes[prevIdx];

                        const prevPrevOpen = opens[prevPrevIdx];
                        const prevPrevClose = closes[prevPrevIdx];
                        const prevPrevHigh = highs[prevPrevIdx];
                        const prevPrevLow = lows[prevPrevIdx];
                        const prevPrevVol = volumes[prevPrevIdx];

                        // --- Condition (1): Color of current candle and prev candle should be different ---
                        const currIsGreen = currClose >= currOpen;
                        const prevIsGreen = prevClose >= prevOpen;
                        if (currIsGreen === prevIsGreen) return null;

                        // --- Condition (2): Abs value of Close chg percent of both current and prev > 2% ---
                        const currCloseChgPct = ((currClose - prevClose) / prevClose) * 100;
                        const prevCloseChgPct = ((prevClose - prevPrevClose) / prevPrevClose) * 100;
                        if (Math.abs(currCloseChgPct) <= 2.0 || Math.abs(prevCloseChgPct) <= 2.0) return null;

                        // --- Condition (3): Both current and prev candle length >= 1.5 * ATR 14 ---
                        const atrArr = calculateATR(highs, lows, closes, 14);
                        const currATR = atrArr[currIdx];
                        const prevATR = atrArr[prevIdx];
                        if (currATR === null || prevATR === null) return null;

                        const currLength = currHigh - currLow;
                        const prevLength = prevHigh - prevLow;
                        if (!(currLength >= 1.5 * currATR && prevLength >= 1.5 * prevATR)) return null;

                        // --- Condition (4): Prev candle length > Prev prev candle length ---
                        const prevPrevLength = prevPrevHigh - prevPrevLow;
                        if (!(prevLength > prevPrevLength)) return null;

                        // --- Condition (5): Prev candle volume > Prev prev candle volume ---
                        if (!(prevVol > prevPrevVol)) return null;

                        // Calculate Dashboard Indicators
                        const prevPrevVolVal = volumes[currIdx - 3]; // For prev vol change calculation vs its prior
                        const prevVolChgPct = prevPrevVol > 0 ? ((prevVol - prevPrevVol) / prevPrevVol) * 100 : 0;
                        const currVolChgPct = prevVol > 0 ? ((currVol - prevVol) / prevVol) * 100 : 0;

                        // SMA 20 condition check
                        const sma20Arr = calculateSMA(closes, 20);
                        const currSMA20 = sma20Arr[currIdx];
                        let smaCheck = false;

                        if (currSMA20 !== null) {
                            if (!currIsGreen && currClose < currSMA20) {
                                smaCheck = true; // Red candle and close below SMA 20
                            } else if (currIsGreen && currClose > currSMA20) {
                                smaCheck = true; // Green candle and close above SMA 20
                            }
                        }

                        return {
                            symbol: symbol,
                            currPriceChg: currCloseChgPct,
                            currVolChg: currVolChgPct,
                            prevVolChg: prevVolChgPct,
                            smaCheck: smaCheck
                        };

                    } catch (err) {
                        console.error(`Error scanning ${symbol}:`, err);
                        return null;
                    }
                });

                const batchResults = await Promise.all(batchPromises);

                batchResults.forEach(res => {
                    if (res !== null) matchedResults.push(res);
                });

                // Update Progress UI
                const scannedCount = Math.min(i + batchSize, totalSymbols);
                const percent = (scannedCount / totalSymbols) * 100;
                progressBar.style.width = `${percent}%`;
                progressCount.innerText = `${scannedCount} / ${totalSymbols}`;

                renderTable();
            }

            progressText.innerText = 'Scan Complete!';

        } catch (error) {
            console.error('Scan Error:', error);
            progressText.innerText = 'Scan failed. Check console.';
        } finally {
            scanBtn.disabled = false;
        }
    }

    // Render Table & Sorting Logic
    function renderTable() {
        const resultsTable = document.getElementById('resultsTable');

        if (matchedResults.length === 0) {
            resultsTable.innerHTML = `<tr><td colspan="5" class="empty-state">No matching symbols found.</td></tr>`;
            return;
        }

        let html = '';
        matchedResults.forEach(item => {
            const priceClass = item.currPriceChg >= 0 ? 'text-green' : 'text-red';
            const priceSign = item.currPriceChg >= 0 ? '+' : '';
            const currVolClass = item.currVolChg >= 0 ? 'text-green' : 'text-red';
            const currVolSign = item.currVolChg >= 0 ? '+' : '';
            const prevVolClass = item.prevVolChg >= 0 ? 'text-green' : 'text-red';
            const prevVolSign = item.prevVolChg >= 0 ? '+' : '';

            const smaBadge = item.smaCheck 
                ? '<span class="badge-true">TRUE</span>' 
                : '<span class="badge-false">FALSE</span>';

            html += `
                <tr>
                    <td><strong>${item.symbol}</strong></td>
                    <td class="${priceClass}">${priceSign}${item.currPriceChg.toFixed(2)}%</td>
                    <td class="${currVolClass}">${currVolSign}${item.currVolChg.toFixed(1)}%</td>
                    <td class="${prevVolClass}">${prevVolSign}${item.prevVolChg.toFixed(1)}%</td>
                    <td>${smaBadge}</td>
                </tr>
            `;
        });

        resultsTable.innerHTML = html;
    }

    function sortTable(column) {
        if (matchedResults.length === 0) return;

        if (currentSortColumn === column) {
            currentSortAsc = !currentSortAsc;
        } else {
            currentSortColumn = column;
            currentSortAsc = false; // Default descending sort
        }

        matchedResults.sort((a, b) => {
            let valA = a[column];
            let valB = b[column];

            if (typeof valA === 'boolean') {
                valA = valA ? 1 : 0;
                valB = valB ? 1 : 0;
            }

            return currentSortAsc ? valA - valB : valB - valA;
        });

        renderTable();
    }
</script>

</body>
</html>
