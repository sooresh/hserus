<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hserus</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #12161c;
            color: #eaecef;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background-color: #1e2329;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 1.3rem;
            color: #f0b90b;
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        label {
            font-size: 0.9rem;
            color: #848e9c;
        }

        select, button {
            background-color: #2b313a;
            color: #eaecef;
            border: 1px solid #474d57;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            outline: none;
            font-size: 0.9rem;
        }

        select:focus, button:hover {
            border-color: #f0b90b;
        }

        button {
            background-color: #f0b90b;
            color: #000;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #d8a407;
        }

        button:disabled {
            background-color: #474d57;
            color: #848e9c;
            cursor: not-allowed;
        }

        /* Progress Bar */
        .progress-container {
            margin-bottom: 20px;
            background-color: #1e2329;
            padding: 15px;
            border-radius: 8px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: #848e9c;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background-color: #2b313a;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: #f0b90b;
            transition: width 0.15s ease;
        }

        /* Table Styles */
        .table-container {
            background-color: #1e2329;
            border-radius: 8px;
            overflow-x: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid #2b313a;
            font-size: 0.9rem;
        }

        th {
            background-color: #181a20;
            color: #848e9c;
            font-weight: 600;
            user-select: none;
        }

        th.sortable {
            cursor: pointer;
        }

        th.sortable:hover {
            color: #f0b90b;
        }

        tr:hover {
            background-color: #2b313a;
        }

        .text-green { color: #0ecb81; }
        .text-red { color: #f6465d; }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #848e9c;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>hserus</h1>
        <div class="controls">
            <label for="timeframe">TF:</label>
            <select id="timeframe">
                <option value="1h" selected>1h</option>
                <option value="4h">4h</option>
            </select>
            <button id="scanBtn" onclick="startScan()">Scan Now</button>
        </div>
    </header>

    <div class="progress-container">
        <div class="progress-info">
            <span id="progressText">Status: Ready</span>
            <span id="progressCount">0 / 250</span>
        </div>
        <div class="progress-bar-bg">
            <div id="progressBar" class="progress-bar-fill"></div>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Symbol</th>
                    <th class="sortable" onclick="sortTable('priceChg')">Price Chg % ⇕</th>
                    <th class="sortable" onclick="sortTable('volChg')">Vol Chg % ⇕</th>
                    <th class="sortable" onclick="sortTable('bodyRatio')">Body Ratio ⇕</th>
                    <th class="sortable" onclick="sortTable('smaStrength')">SMA 8 Str % ⇕</th>
                </tr>
            </thead>
            <tbody id="resultsTable">
                <tr>
                    <td colspan="5" class="empty-state">Click "Scan Now".</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    let matchedResults = [];
    let currentSortColumn = '';
    let currentSortAsc = false;

    // Technical Analysis Helpers
    function calculateSMA(closes, period) {
        let sma = [];
        for (let i = 0; i < closes.length; i++) {
            if (i < period - 1) {
                sma.push(null);
                continue;
            }
            let sum = 0;
            for (let j = 0; j < period; j++) {
                sum += closes[i - j];
            }
            sma.push(sum / period);
        }
        return sma;
    }

    // Check trend over last 5 candles (4 transitions)
    function checkTrend(smaArr, currIdx, direction) {
        let count = 0;
        for (let j = 0; j < 4; j++) {
            let p1 = currIdx - 4 + j;
            let p2 = currIdx - 4 + j + 1;
            if (smaArr[p1] !== null && smaArr[p2] !== null) {
                if (direction === 'descending' && smaArr[p2] < smaArr[p1]) count++;
                if (direction === 'ascending' && smaArr[p2] > smaArr[p1]) count++;
            }
        }
        return count >= 3;
    }

    // Main Scanning Process
    async function startScan() {
        const scanBtn = document.getElementById('scanBtn');
        const timeframeSelect = document.getElementById('timeframe');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const progressCount = document.getElementById('progressCount');
        const resultsTable = document.getElementById('resultsTable');

        const interval = timeframeSelect.value;

        // UI State Reset
        scanBtn.disabled = true;
        matchedResults = [];
        resultsTable.innerHTML = '';
        progressBar.style.width = '0%';
        progressText.innerText = 'Fetching top 250 USDT perpetual futures by volume...';
        progressCount.innerText = '0 / 250';

        try {
            const tickerResponse = await fetch('https://fapi.binance.com/fapi/v1/ticker/24hr');
            const tickers = await tickerResponse.json();

            const top250Symbols = tickers
                .filter(t => t.symbol.endsWith('USDT'))
                .sort((a, b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume))
                .slice(0, 250)
                .map(t => t.symbol);

            const batchSize = 10;
            const totalSymbols = top250Symbols.length;

            progressText.innerText = 'Scanning symbols...';

            for (let i = 0; i < totalSymbols; i += batchSize) {
                const batch = top250Symbols.slice(i, i + batchSize);

                const batchPromises = batch.map(async (symbol) => {
                    try {
                        // Request 70 candles to securely compute 50 SMA and lookbacks
                        const klineRes = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=${interval}&limit=70`);
                        const klines = await klineRes.json();

                        if (!klines || klines.length < 60) return null;

                        const opens = klines.map(k => parseFloat(k[1]));
                        const closes = klines.map(k => parseFloat(k[4]));
                        const volumes = klines.map(k => parseFloat(k[5]));

                        const currIdx = klines.length - 1;
                        const prevIdx = currIdx - 1;
                        const prevPrevIdx = currIdx - 2;
                        const prevPrevPrevIdx = currIdx - 3;

                        const currOpen = opens[currIdx];
                        const currClose = closes[currIdx];
                        const prevOpen = opens[prevIdx];
                        const prevClose = closes[prevIdx];

                        const currVol = volumes[currIdx];
                        const prevVol = volumes[prevIdx];

                        const isGreen = currClose >= currOpen;
                        const isRed = !isGreen;

                        // --- Condition (1): Current body length > 2 * previous body length ---
                        const currBody = Math.abs(currClose - currOpen);
                        const prevBody = Math.abs(prevClose - prevOpen);
                        if (prevBody === 0) return null;
                        if (!(currBody > prevBody * 2)) return null;

                        // --- Condition (2): Absolute value of one of the last 4 candles close chg >= 1% ---
                        let hasValidChg = false;
                        for (let offset = 0; offset <= 3; offset++) {
                            const idx = currIdx - offset;
                            const cClose = closes[idx];
                            const cOpen = opens[idx];
                            const cPrevClose = closes[idx - 1];
                            const chgPct = ((cClose - cPrevClose) / cPrevClose) * 100;
                            if (Math.abs(chgPct) >= 1.0) {
                                hasValidChg = true;
                                break;
                            }
                        }
                        if (!hasValidChg) return null;

                        // --- Condition (3): Lookback between Prev-Prev & Prev-Prev-Prev biggest candle ---
                        const ppClose = closes[prevPrevIdx];
                        const ppPrevClose = closes[prevPrevIdx - 1];
                        const ppChg = ((ppClose - ppPrevClose) / ppPrevClose) * 100;

                        const pppClose = closes[prevPrevPrevIdx];
                        const pppPrevClose = closes[prevPrevPrevIdx - 1];
                        const pppChg = ((pppClose - pppPrevClose) / pppPrevClose) * 100;

                        if (isGreen) {
                            // Find biggest candle between pp and ppp (most negative change)
                            const targetChg = Math.min(ppChg, pppChg);
                            if (!(targetChg <= -0.7)) return null;
                        } else {
                            // Find biggest candle between pp and ppp (most positive change)
                            const targetChg = Math.max(ppChg, pppChg);
                            if (!(targetChg >= 0.7)) return null;
                        }

                        // Calculate SMAs
                        const sma8 = calculateSMA(closes, 8);
                        const sma20 = calculateSMA(closes, 20);
                        const sma50 = calculateSMA(closes, 50);

                        if (sma8[currIdx] === null || sma50[currIdx] === null) return null;

                        // --- Condition (4): 8 SMA of previous candle direction ---
                        const prevSMA8 = sma8[prevIdx];
                        const prevPrevSMA8 = sma8[prevIdx - 1];
                        if (prevSMA8 === null || prevPrevSMA8 === null) return null;

                        const sma8Decreasing = prevSMA8 < prevPrevSMA8;
                        const sma8Increasing = prevSMA8 > prevPrevSMA8;

                        if (isGreen && !sma8Decreasing) return null;
                        if (isRed && !sma8Increasing) return null;

                        // --- Condition (5): 20 SMA or 50 SMA trend over last 5 candles ---
                        const trendDir = isGreen ? 'descending' : 'ascending';
                        const sma20Valid = checkTrend(sma20, currIdx, trendDir);
                        const sma50Valid = checkTrend(sma50, currIdx, trendDir);
                        if (!(sma20Valid || sma50Valid)) return null;

                        // Dashboard metrics
                        const priceChgPct = ((currClose - prevClose) / prevClose) * 100;
                        const volChgPct = ((currVol - prevVol) / prevVol) * 100;
                        const bodyRatio = currBody / prevBody;

                        // Strength of prev candle 8 SMA line (percentage slope between prev-prev and prev)
                        const sma8Strength = ((prevSMA8 - prevPrevSMA8) / prevPrevSMA8) * 100;

                        return {
                            symbol: symbol,
                            priceChg: priceChgPct,
                            volChg: volChgPct,
                            bodyRatio: bodyRatio,
                            smaStrength: sma8Strength
                        };

                    } catch (err) {
                        console.error(`Error scanning ${symbol}:`, err);
                        return null;
                    }
                });

                const batchResults = await Promise.all(batchPromises);

                batchResults.forEach(res => {
                    if (res !== null) matchedResults.push(res);
                });

                // Update Progress UI
                const scannedCount = Math.min(i + batchSize, totalSymbols);
                const percent = (scannedCount / totalSymbols) * 100;
                progressBar.style.width = `${percent}%`;
                progressCount.innerText = `${scannedCount} / ${totalSymbols}`;

                renderTable();
            }

            progressText.innerText = 'Scan Complete!';

        } catch (error) {
            console.error('Scan Error:', error);
            progressText.innerText = 'Scan failed. Check console.';
        } finally {
            scanBtn.disabled = false;
        }
    }

    // Render Table & Sorting Logic
    function renderTable() {
        const resultsTable = document.getElementById('resultsTable');

        if (matchedResults.length === 0) {
            resultsTable.innerHTML = `<tr><td colspan="5" class="empty-state">No matching symbols found.</td></tr>`;
            return;
        }

        let html = '';
        matchedResults.forEach(item => {
            const priceClass = item.priceChg >= 0 ? 'text-green' : 'text-red';
            const priceSign = item.priceChg >= 0 ? '+' : '';
            const strengthClass = item.smaStrength >= 0 ? 'text-green' : 'text-red';
            const strengthSign = item.smaStrength >= 0 ? '+' : '';

            html += `
                <tr>
                    <td><strong>${item.symbol}</strong></td>
                    <td class="${priceClass}">${priceSign}${item.priceChg.toFixed(2)}%</td>
                    <td class="text-green">+${item.volChg.toFixed(1)}%</td>
                    <td>${item.bodyRatio.toFixed(2)}x</td>
                    <td class="${strengthClass}">${strengthSign}${item.smaStrength.toFixed(3)}%</td>
                </tr>
            `;
        });

        resultsTable.innerHTML = html;
    }

    function sortTable(column) {
        if (matchedResults.length === 0) return;

        if (currentSortColumn === column) {
            currentSortAsc = !currentSortAsc;
        } else {
            currentSortColumn = column;
            currentSortAsc = false; // Default descending sort
        }

        matchedResults.sort((a, b) => {
            let valA = a[column];
            let valB = b[column];
            return currentSortAsc ? valA - valB : valB - valA;
        });

        renderTable();
    }
</script>

</body>
</html>
